name: Android CI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-upstream-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      upstream_tag: ${{ steps.latest.outputs.tag }}
      should_run: ${{ steps.check.outputs.should_run }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_name: ${{ steps.check.outputs.release_name }}
      version_name: ${{ steps.check.outputs.version_name }}

    steps:
      - name: Determine latest upstream release tag
        id: latest
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            git ls-remote --tags https://github.com/LiteLDev/LeviLaunchroid.git \
              | awk '{print $2}' \
              | sed 's#refs/tags/##; s/\^{}$//' \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream release tag found."
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release tag: $LATEST_TAG"

      - name: Determine whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG="${{ steps.latest.outputs.tag }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch detected."
            echo "Forcing build regardless of upstream sync state."

            SHOULD_RUN=true

          else
            if git ls-remote --exit-code --tags \
                "https://github.com/${{ github.repository }}.git" \
                "refs/tags/sync/$UPSTREAM_TAG" >/dev/null 2>&1; then

              echo "Upstream $UPSTREAM_TAG is already synced."
              echo "Scheduled build will be skipped."

              SHOULD_RUN=false

            else
              echo "New upstream tag detected: $UPSTREAM_TAG"
              echo "Scheduled build will run."

              SHOULD_RUN=true
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_RUN" = "false" ]; then
            exit 0
          fi

          VERSION_BASE="${UPSTREAM_TAG#v}"

          EXISTING=$(
            gh api \
              "repos/${{ github.repository }}/releases" \
              --paginate \
              --jq '.[].tag_name' \
              | grep -E "^levilaunchroid-${UPSTREAM_TAG}(-r[0-9]+)?$" \
              || true
          )

          if [ -z "$EXISTING" ]; then
            REVISION=1

            RELEASE_TAG="levilaunchroid-${UPSTREAM_TAG}"
            RELEASE_NAME="LeviLaunchroid ${UPSTREAM_TAG}"

          else
            MAX_REV=$(
              echo "$EXISTING" \
                | sed -E \
                    "s/^levilaunchroid-${UPSTREAM_TAG}-r([0-9]+)$/\1/; \
                     s/^levilaunchroid-${UPSTREAM_TAG}$/1/" \
                | sort -n \
                | tail -1
            )

            REVISION=$((MAX_REV + 1))

            RELEASE_TAG="levilaunchroid-${UPSTREAM_TAG}-r${REVISION}"
            RELEASE_NAME="LeviLaunchroid ${UPSTREAM_TAG} (Update ${REVISION})"
          fi

          VERSION_NAME="${VERSION_BASE}-${REVISION}"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Upstream tag : $UPSTREAM_TAG"
          echo "Version base : $VERSION_BASE"
          echo "Revision     : $REVISION"
          echo "versionName  : $VERSION_NAME"
          echo "Release tag  : $RELEASE_TAG"
          echo "Release name : $RELEASE_NAME"

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"

            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using CI-only Firebase placeholder."

            mkdir -p app

            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

            exit 0
          fi

          mkdir -p app

          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" \
            | base64 --decode \
            > app/google-services.json

          python3 -m json.tool app/google-services.json > /dev/null

          python3 - <<'PY'
          import json
          import sys

          expected = "org.levimc.launcher"

          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }

          if expected not in package_names:
              actual = ", ".join(
                  sorted(name for name in package_names if name)
              ) or "<none>"

              print(
                  f"google-services.json package_name mismatch: "
                  f"expected {expected}, got {actual}",
                  file=sys.stderr
              )

              sys.exit(1)
          PY

          echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/Android/Sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Set dynamic versionName
        env:
          VERSION_NAME: ${{ needs.check.outputs.version_name }}
        run: |
          set -euo pipefail

          echo "Setting versionName to $VERSION_NAME"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          version = os.environ["VERSION_NAME"]

          updated, count = re.subn(
              r'(versionName\s*=?\s*)"[^"]*"',
              rf'\1"{version}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not find exactly one versionName in app/build.gradle"
              )

          path.write_text(updated)

          print(f"versionName set to {version}")
          PY

          grep -n "versionName" app/build.gradle

      - name: Build APKs
        run: |
          ./gradlew assembleDebug assembleBeta assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename Signed APK
        run: |
          set -euo pipefail

          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          VERSION="${{ needs.check.outputs.version_name }}"

          if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
            echo "Signed APK was not produced."
            exit 1
          fi

          APK_NAME="levilaunchroid-extra-v${VERSION}-all.apk"

          cp "$SIGNED_APK" "$APK_NAME"

          echo "Created $APK_NAME"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all
          path: levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: ${{ needs.check.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all.apk
          body: |
            Built against upstream release `${{ needs.check.outputs.upstream_tag }}`.

            Custom version:
            `${{ needs.check.outputs.version_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create sync marker
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail

          TAG="${{ needs.check.outputs.upstream_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "sync/$TAG"
          git push origin "sync/$TAG"
