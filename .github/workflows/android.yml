name: Android CI

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using a CI-only Firebase placeholder for compile checks."
            mkdir -p app
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            exit 0
          fi

          mkdir -p app
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          python3 - <<'PY'
          import json
          import sys

          expected = "org.levimc.launcher"
          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }
          if expected not in package_names:
              actual = ", ".join(sorted(name for name in package_names if name)) or "<none>"
              print(
                  f"google-services.json package_name mismatch: expected {expected}, got {actual}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ${{ runner }}/Android/Sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: $2a$10$bL4bIL5pUWqfcO7KQtnMReakwtfHbNKh6v1uTpKlzhwoueEJQnPnm #curseforge launcher key
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build APKs
        run: |
          if [ "${{ github.ref_name }}" = "test" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug assembleBeta assembleRelease --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Unsigned Release APK
        if: github.ref_name != 'test'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        if: github.ref_name != 'test'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APK
        if: github.ref_name != 'test'
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Get version name
        if: github.ref_name != 'test'
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename Signed APK
        if: github.ref_name != 'test'
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            APK_NAME="levilaunchroid-extra-v${{ steps.version.outputs.version }}-all.apk"
            cp "$SIGNED_APK" "$APK_NAME"
            echo "Signed APK renamed to $APK_NAME"
          fi

      - name: Upload Signed APK Artifact
        if: github.ref_name != 'test' && hashFiles('levilaunchroid-extra-v*-all.apk') != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: levilaunchroid-extra-v${{ steps.version.outputs.version }}-all
          path: levilaunchroid-extra-v*-all.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files:levilaunchroid-extra-v${{ steps.version.outputs.version }}-all.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
