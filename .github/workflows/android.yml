name: Android CI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-upstream-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      upstream_tag: ${{ steps.latest.outputs.tag }}
      should_run: ${{ steps.check.outputs.should_run }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_name: ${{ steps.check.outputs.release_name }}
      version_name: ${{ steps.check.outputs.version_name }}

    steps:
      - name: Determine latest upstream release tag
        id: latest
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            git ls-remote --tags https://github.com/LiteLDev/LeviLaunchroid.git \
              | awk '{print $2}' \
              | sed 's#refs/tags/##; s/\^{}$//' \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream release tag found."
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release tag: $LATEST_TAG"

      - name: Determine whether to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG="${{ steps.latest.outputs.tag }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch detected."
            echo "Forcing build regardless of upstream sync state."

            SHOULD_RUN=true

          else
            if git ls-remote --exit-code --tags \
                "https://github.com/${{ github.repository }}.git" \
                "refs/tags/sync/$UPSTREAM_TAG" >/dev/null 2>&1; then

              echo "Upstream $UPSTREAM_TAG is already synced."
              echo "Scheduled build will be skipped."

              SHOULD_RUN=false

            else
              echo "New upstream tag detected: $UPSTREAM_TAG"
              echo "Scheduled build will run."

              SHOULD_RUN=true
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_RUN" = "false" ]; then
            exit 0
          fi

          VERSION_BASE="${UPSTREAM_TAG#v}"

          EXISTING=$(
            gh api \
              "repos/${{ github.repository }}/releases" \
              --paginate \
              --jq '.[].tag_name' \
              | grep -E "^levilaunchroid-${UPSTREAM_TAG}(-r[0-9]+)?$" \
              || true
          )

          if [ -z "$EXISTING" ]; then
            REVISION=1

            RELEASE_TAG="levilaunchroid-${UPSTREAM_TAG}"
            RELEASE_NAME="LeviLaunchroid ${UPSTREAM_TAG}"

          else
            MAX_REV=$(
              echo "$EXISTING" \
                | sed -E \
                    "s/^levilaunchroid-${UPSTREAM_TAG}-r([0-9]+)$/\1/; \
                     s/^levilaunchroid-${UPSTREAM_TAG}$/1/" \
                | sort -n \
                | tail -1
            )

            REVISION=$((MAX_REV + 1))

            RELEASE_TAG="levilaunchroid-${UPSTREAM_TAG}-r${REVISION}"
            RELEASE_NAME="LeviLaunchroid ${UPSTREAM_TAG} (Update ${REVISION})"
          fi

          VERSION_NAME="${VERSION_BASE}-${REVISION}"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Upstream tag : $UPSTREAM_TAG"
          echo "Version base : $VERSION_BASE"
          echo "Revision     : $REVISION"
          echo "versionName  : $VERSION_NAME"
          echo "Release tag  : $RELEASE_TAG"
          echo "Release name : $RELEASE_NAME"

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using CI-only Firebase placeholder."

            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            exit 0
          fi

          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" \
            | base64 --decode \
            > app/google-services.json

          python3 -m json.tool app/google-services.json > /dev/null

          python3 - << 'EOF'
          import json
          import sys

          expected = "org.levimc.launcher"

          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }

          if expected not in package_names:
              actual = ", ".join(
                  sorted(name for name in package_names if name)
              ) or "<none>"

              print(
                  f"google-services.json package_name mismatch: "
                  f"expected {expected}, got {actual}",
                  file=sys.stderr
              )

              sys.exit(1)
          EOF

          echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/Android/Sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Set dynamic versionName
        env:
          VERSION_NAME: ${{ needs.check.outputs.version_name }}
        run: |
          set -euo pipefail

          echo "Setting versionName to $VERSION_NAME"

          python3 - << 'EOF'
          from pathlib import Path
          import os
          import re

          gradle_path = Path("app/build.gradle")
          if not gradle_path.exists():
              gradle_path = Path("app/build.gradle.kts")

          text = gradle_path.read_text(encoding="utf-8")
          version = os.environ["VERSION_NAME"]

          updated, count = re.subn(
              r'(versionName\s*=?\s*)"[^"]*"',
              rf'\1"{version}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"Could not find exactly one versionName in {gradle_path}"
              )

          gradle_path.write_text(updated, encoding="utf-8")
          print(f"versionName set to {version} in {gradle_path}")
          EOF

      - name: Build APKs
        run: |
          ./gradlew assembleDebug assembleBeta assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLaunchroid-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          alias: ${{ vars.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename Signed APK
        run: |
          set -euo pipefail

          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          VERSION="${{ needs.check.outputs.version_name }}"

          if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
            echo "Signed APK was not produced."
            exit 1
          fi

          APK_NAME="levilaunchroid-extra-v${VERSION}-all.apk"
          cp "$SIGNED_APK" "$APK_NAME"
          echo "Created $APK_NAME"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all
          path: levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all.apk

      - name: Generate Release Notes
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.release_tag }}"
          VER="${{ needs.check.outputs.version_name }}"
          UPSTREAM="${{ needs.check.outputs.upstream_tag }}"
          REPO="${{ github.repository }}"

          echo "Built against upstream release \`$UPSTREAM\`." > release_notes.md
          echo "" >> release_notes.md
          echo "Custom version:" >> release_notes.md
          echo "\`$VER\`" >> release_notes.md
          echo "" >> release_notes.md

          UPSTREAM_JSON=$(curl -s "https://api.github.com/repos/LiteLDev/LeviLaunchroid/releases/tags/$UPSTREAM" || true)
          UPSTREAM_BODY=$(echo "$UPSTREAM_JSON" | jq -r '.body // empty')

          if [ -n "$UPSTREAM_BODY" ] && [ "$UPSTREAM_BODY" != "null" ]; then
              echo "### Upstream Release Notes ($UPSTREAM)" >> release_notes.md
              echo "$UPSTREAM_BODY" >> release_notes.md
              echo "" >> release_notes.md
          fi

          echo "**Full Changelog**: https://github.com/${REPO}/compare/${TAG}...${TAG}" >> release_notes.md

      - name: Generate build.json
        run: |
          set -euo pipefail
          python3 -c '
          import os, json, glob, subprocess, zipfile, re

          build_json = {}
          apk = "levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all.apk"
          if os.path.exists(apk):
              filename = os.path.basename(apk)
              changelog = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
              applied_patches = [
                  "Removed Google Play store verification requirement",
                  "Removed package name lock (imported MC APKs not limited to com.mojang.minecraftpe)",
                  "Restored memory editor feature",
                  "Removed forced version isolation for custom versions",
                  "CurseForge API integration for mod discovery"
              ]

              min_sdk = "28"
              native_libraries = []
              densities = []

              try:
                  aapt = subprocess.run(["which", "aapt2"], capture_output=True, text=True).stdout.strip() or subprocess.run(["which", "aapt"], capture_output=True, text=True).stdout.strip()
                  if aapt:
                      out = subprocess.run([aapt, "dump", "badging", apk], capture_output=True, text=True).stdout
                      m_sdk = re.search(r"(?:sdkVersion|minSdkVersion):\x27([^\x27]+)\x27", out)
                      if m_sdk:
                          min_sdk = m_sdk.group(1)
                      m_den = re.search(r"densities:\s*\x27([^\x27]+)\x27", out)
                      if m_den:
                          densities = [d for d in m_den.group(1).split() if d]
                      m_nat = re.search(r"native-code:\s*\x27([^\x27]+)\x27", out)
                      if m_nat:
                          native_libraries = [n for n in m_nat.group(1).split() if n]
              except Exception as e:
                  print(f"aapt dump failed: {e}")

              if not native_libraries and zipfile.is_zipfile(apk):
                  try:
                      with zipfile.ZipFile(apk, "r") as z:
                          libs = set()
                          for f in z.namelist():
                              if f.startswith("lib/") and "/" in f[4:]:
                                  libs.add(f.split("/")[1])
                          if libs:
                              native_libraries = sorted(list(libs))
                  except Exception as e:
                      print(f"zip inspection failed: {e}")

              entry_key = filename.lower()
              build_json[entry_key] = {
                  "name": filename,
                  "arch": "universal",
                  "ext": "apk",
                  "version": "${{ needs.check.outputs.version_name }}",
                  "min_sdk": min_sdk,
                  "densities": densities,
                  "native_libraries": native_libraries,
                  "patches": "levilaunchroid-extra",
                  "changelog": changelog,
                  "applied_patches": applied_patches
              }

          with open("build.json", "w") as f:
              json.dump(build_json, f, indent=2)
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: ${{ needs.check.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            levilaunchroid-extra-v${{ needs.check.outputs.version_name }}-all.apk
            build.json
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create sync marker
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail

          TAG="${{ needs.check.outputs.upstream_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "sync/$TAG"
          git push origin "sync/$TAG"
